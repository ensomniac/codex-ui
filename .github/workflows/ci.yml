name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: "3.12"
          - os: macos-15-intel
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --group dev
      - run: uv run python scripts/prepare.py --check
      - run: uv run ruff check .
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run codex-ui capabilities
      - run: uv run codex-ui schema
      - run: uv build
      - name: Exercise candidate updater against the published release
        if: github.repository == 'ensomniac/codex-ui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/smoke_release.py --candidate dist
      - run: uv run twine check dist/*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm test
      - run: npm pack
  site:
    name: Site experience
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
  complete:
    name: CI
    needs: [test, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test.result }}' = success && test '${{ needs.site.result }}' = success
