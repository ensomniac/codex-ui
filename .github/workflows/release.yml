name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already merged to main, without v
        required: true
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'ensomniac/codex-ui' && github.actor == 'ensomniac' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: uv sync --locked --group dev
      - name: Validate release authority, version and main CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          uv run python - <<'PY'
          import json, os, re, subprocess
          from codex_ui import __version__
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert version == __version__
          result = subprocess.check_output(['gh', 'api', f"repos/ensomniac/codex-ui/commits/{os.environ['GITHUB_SHA']}/check-runs?per_page=100"])
          checks = [c for c in json.loads(result)['check_runs'] if c['name'] == 'CI']
          assert checks and max(checks, key=lambda c: c['id'])['conclusion'] == 'success', 'Main CI must pass first'
          PY
      - run: uv run python scripts/prepare.py --check
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run twine check dist/*
      - run: npm pack --pack-destination dist
      - name: Verify formula and write checksums
        run: |
          uv run python - <<'PY'
          import hashlib
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl'))
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert digest in Path('Formula/codex-ui.rb').read_text(), 'Formula wheel hash differs from release build'
          files = sorted(Path('dist').iterdir())
          Path('dist/SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish immutable versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v$RELEASE_VERSION" dist/* --target "$GITHUB_SHA" --title "codex-ui $RELEASE_VERSION" --notes-file CHANGELOG.md
