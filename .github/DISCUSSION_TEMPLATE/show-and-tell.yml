body:
  - type: markdown
    attributes:
      value: |
        Share a desktop task you actually ran. Include limitations so someone else can reproduce it. Inspect captures for private content before attaching them.
  - type: textarea
    id: task
    attributes:
      label: Task and environment
      description: The goal, app, macOS version, codex-ui version, and agent host if applicable.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands or the prompt you used, with private details removed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result and limitations
      description: What worked, how you checked it, and anything that did not work. Evidence is welcome; do not include private content.
    validations:
      required: true
